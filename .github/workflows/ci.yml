name: Tests
on: [push, pull_request]
permissions:
  contents: read
jobs:
  backend:
    runs-on: ubuntu-latest
    env:
      DEV: '1'
      SECRET_KEY: ci-test-only-not-production
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: pip install -r requirements.txt
      - run: python manage.py check
      - run: python manage.py makemigrations --check --dry-run
      - run: python manage.py test
      - name: Production deployment checks (no live credentials)
        run: |
          unset DEV
          export SECRET_KEY=$(python -c 'import secrets; print(secrets.token_urlsafe(64))')
          export DATABASE_URL=postgresql://check:check@localhost/check
          export ALLOWED_HOSTS=baby-daily-api.onrender.com
          export CLIENT_ORIGIN=https://baby-daily-8c4.pages.dev
          bash scripts/check-deploy.sh
  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm test
      - run: npm run build
      - run: npm audit --audit-level=high
